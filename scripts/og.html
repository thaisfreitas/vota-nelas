<!DOCTYPE html>
<!-- Fonte da imagem de compartilhamento (site/og.png). Gerar com: sh scripts/gerar_og.sh -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@600;700&display=swap">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#FBF7FA;color:#2B1330;font-family:Figtree,system-ui,sans-serif;display:grid;grid-template-columns:1fr 380px;gap:56px;align-items:center;padding:0 72px;box-sizing:border-box}
  .logo{display:flex;align-items:center;gap:14px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px}
  .logo i{width:52px;height:52px;border-radius:50%;background:#A3123F;color:#fff;display:grid;place-items:center;font-style:normal;font-size:30px}
  .logo em{font-style:normal;color:#A3123F}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:62px;line-height:1.02;letter-spacing:-.02em;margin:34px 0 22px}
  h1 span{color:#A3123F}
  p{font-size:28px;font-weight:600;color:#6E5A70;margin:0}
  .dots{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
  .dots i{aspect-ratio:1;border-radius:50%;background:#CDBFCB}
  .dots i.w{background:#A3123F}
  .cap{font-size:22px;font-weight:700;margin:18px 0 0;color:#2B1330}
</style>
</head>
<body>
  <div>
    <div class="logo"><i>✓</i>Vota <em>Nelas</em></div>
    <h1>Mulheres são 52% do eleitorado. Na Câmara, são <span>17,7%</span>.</h1>
    <p>Monte sua urna só com mulheres · 4 de outubro</p>
  </div>
  <div>
    <div class="dots" id="d"></div>
    <p class="cap">A cada 100 cadeiras, só 18 são de mulheres.</p>
  </div>
  <script>for(let i=0;i<100;i++){const e=document.createElement("i");if(i<18)e.className="w";d.appendChild(e)}</script>
</body>
</html>

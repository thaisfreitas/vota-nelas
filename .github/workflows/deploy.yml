name: Deploy

# Publicação manual: Actions → Deploy → Run workflow.
# Roda os testes de novo e só publica se todos passarem.
on:
  workflow_dispatch:

# nunca dois deploys ao mesmo tempo; um novo espera o anterior terminar
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  testes:
    uses: ./.github/workflows/testes.yml

  deploy:
    name: Publica no Cloudflare
    needs: testes
    # só a main vai para o ar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: producao
      url: ${{ steps.publica.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5
      - id: publica
        uses: cloudflare/wrangler-action@v3
        with:
          # a versão padrão da action (3.90) não lê wrangler.jsonc
          wranglerVersion: "4.139.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # cria/atualiza as tabelas do manifesto no D1 antes de publicar o Worker
          command: |
            d1 migrations apply vota-nelas --remote
            deploy
